<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="软考中级·软件设计师 备考学习站：真题刷题、分类练习、速记卡片、案例分析、错题本，纯静态本地存储，免费托管于 GitHub Pages。">
<title>软考中级 · 软件设计师学习站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="App.go('dash')" title="回到首页">
      <span class="brand-mark">软</span>
      <span class="brand-text">软考中级 · 软件设计师<small>备考学习站</small></span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-btn" data-view="dash">仪表盘</button>
      <button class="nav-btn" data-view="quiz">刷题</button>
      <button class="nav-btn" data-view="case">案例分析</button>
      <button class="nav-btn" data-view="cards">速记卡片</button>
      <button class="nav-btn" data-view="wrong">错题本<span class="badge" id="wrongBadge" hidden>0</span></button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题"></button>
    </div>
  </div>
</header>

<main id="view" class="container" aria-live="polite">
  <div class="loading" id="bootLoading">正在加载题库…</div>
</main>

<footer class="foot">
  数据源：历年真题 853 题（软件设计师考试试题分类精解）+ AI 精炼题 · 纯本地运行，进度保存在浏览器
</footer>

<div class="toast" id="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/dash.js"></script>
<script src="js/quiz.js"></script>
<script src="js/case.js"></script>
<script src="js/cards.js"></script>
<script src="js/wrong.js"></script>
<script src="js/app.js"></script>
</body>
</html>
